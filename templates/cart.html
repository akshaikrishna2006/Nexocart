<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shopping Cart - Meesho</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 30px; background: #f8f9fa; }
        .cart-box { max-width: 700px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { color: #9c27b0; text-align: center; margin-bottom: 20px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 15px 0; }
        .remove-btn { color: #d32f2f; text-decoration: none; font-weight: bold; font-size: 0.9em; margin-top: 5px; display: inline-block; }
        .remove-btn:hover { text-decoration: underline; }
        .total { text-align: right; font-size: 1.4em; margin-top: 25px; font-weight: bold; color: #2e7d32; }
        .btn { background: #9c27b0; color: white; padding: 12px 25px; text-decoration: none; border-radius: 6px; float: right; margin-top: 20px; font-weight: bold; }
        .btn:hover { background: #7b1fa2; }
    </style>
</head>
<body>
    <div class="cart-box">
        <h2>Your Shopping Cart</h2>
        {% for item in cart_items %}
            <div class="cart-item">
                <div>
                    <h4 style="margin: 0 0 5px 0;">{{ item.product.name }}</h4>
                    <p style="margin: 0; color: #666;">Quantity: {{ item.quantity }}</p>
                    <a href="{% url 'remove_from_cart' item.product.pk %}" class="remove-btn">Remove</a>
                </div>
                <div style="font-size: 1.2em; font-weight: bold; color: #333;">₹{{ item.item_total }}</div>
            </div>
        {% empty %}
            <p style="text-align: center; color: #666;">Your cart is empty!</p>
        {% endfor %}

        {% if cart_items %}
            <div class="total">Total: ₹{{ total_price }}</div>
            <div style="clear: both;"></div>
            <a href="{% url 'checkout' %}" class="btn">Proceed to Checkout</a>
        {% endif %}
    </div>
</body>
</html>
