<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Placed - Meesho</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin-top: 80px; background: #f8f9fa; }
        .box { background: white; display: inline-block; padding: 40px 60px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #28a745; margin-bottom: 10px; }
        p { font-size: 1.1em; color: #555; }
        .payment-info { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 12px; border-radius: 6px; margin: 20px 0; color: #166534; font-weight: bold; }
        a { color: white; background: #9c27b0; text-decoration: none; font-weight: bold; padding: 12px 25px; border-radius: 6px; display: inline-block; margin-top: 15px; }
        a:hover { background: #7b1fa2; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🎉 Order Placed Successfully!</h1>
        <p>Thank you for shopping with Meesho Clone.</p>
        
        <div class="payment-info">
            Payment Method Selected: {{ payment_method }}
        </div>
        
        <a href="{% url 'product_list' %}">Continue Shopping</a>
    </div>
</body>
</html>
